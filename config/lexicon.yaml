# Entity lexicon for the GraphRAG linker (version 1, hand-written, NEEDS REVIEW BY A DOMAIN ADVISOR).
# Herbs and drugs come from config/scope.yaml (names + aliases). This file adds extra Sanskrit/OCR-era spellings of scoped herbs,
# doshas, and a compact list of conditions found in the 1890-1916 English translations.

extra_herb_aliases:
  Phyllanthus emblica: [Amalaki, Dhatri, Emblic myrobalan]
  Terminalia chebula: [Abhaya, Pathya, Chebulic myrobalan]
  Withania somnifera: [Asvagandha]
  Zingiber officinale: [Sunthi, Nagara, dry ginger]
  Allium sativum: [Rasona]
  Trigonella foenum-graecum: [Methika]
  Tinospora sinensis: [Amrita]
  Momordica charantia: [Karavellaka]
  Azadirachta indica: [Arishta]

doshas:
  vata: [vata, vayu, wind, windy humour, vatic]
  pitta: [pitta, bile, bilious]
  kapha: [kapha, shleshma, phlegm, phlegmatic]
  tridosha: [tridosha, three doshas, three humours]

